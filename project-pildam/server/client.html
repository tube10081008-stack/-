<title>필담</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700&family=IBM+Plex+Sans+KR:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --ground:#E9EAE4; --paper:#FAFAF7; --sunken:#DEE0D8;
  --ink:#191F1D; --ink-soft:#3D4744; --muted:#69746F; --faint:#939E98;
  --rule:#D3D7CE; --rule-soft:#E1E4DC;
  --seal:#9C3A2D; --seal-wash:#9C3A2D12; --seal-rail:#9C3A2D;
  --celadon:#3D7365; --celadon-wash:#3D736510;
  --indigo:#2E4858; --on-indigo:#F2F4F1;
  --ochre:#87621A; --ochre-wash:#87621A16;
  --shadow:0 1px 2px rgba(25,31,29,.07), 0 6px 18px rgba(25,31,29,.05);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#101514; --paper:#191F1D; --sunken:#0B0F0E;
    --ink:#E6E9E3; --ink-soft:#C0C8C2; --muted:#8F9C95; --faint:#6A7772;
    --rule:#2A322F; --rule-soft:#222927;
    --seal:#D07360; --seal-wash:#D073601C; --seal-rail:#B7563F;
    --celadon:#82B8A7; --celadon-wash:#82B8A714;
    --indigo:#7FA6BC; --on-indigo:#0E1518;
    --ochre:#CBA35C; --ochre-wash:#CBA35C1A;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 6px 18px rgba(0,0,0,.25);
  }
}
:root[data-theme="dark"]{
  --ground:#101514; --paper:#191F1D; --sunken:#0B0F0E;
  --ink:#E6E9E3; --ink-soft:#C0C8C2; --muted:#8F9C95; --faint:#6A7772;
  --rule:#2A322F; --rule-soft:#222927;
  --seal:#D07360; --seal-wash:#D073601C; --seal-rail:#B7563F;
  --celadon:#82B8A7; --celadon-wash:#82B8A714;
  --indigo:#7FA6BC; --on-indigo:#0E1518;
  --ochre:#CBA35C; --ochre-wash:#CBA35C1A;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 6px 18px rgba(0,0,0,.25);
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--ground); color:var(--ink);
  font-family:"IBM Plex Sans KR",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  font-weight:300; font-size:16px; line-height:1.7; word-break:keep-all;
  -webkit-text-size-adjust:100%; overscroll-behavior:none;
}
button{font:inherit; color:inherit; background:none; border:0; cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--celadon); outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none !important; transition:none !important}}

#app{max-width:34rem; margin:0 auto; height:100dvh; display:flex; flex-direction:column; background:var(--ground)}
.view{flex:1; min-height:0; display:none; flex-direction:column}
.view.on{display:flex}

/* ── 홈 ─────────────────────────────────── */
#home{overflow-y:auto; padding:2.2rem 1.15rem 2.6rem; gap:1.5rem}
.brand{font-family:"Nanum Myeongjo",serif; font-weight:700; font-size:2.4rem; letter-spacing:.06em; margin:0}
.brand small{display:block; font-family:"IBM Plex Mono",monospace; font-size:.66rem; font-weight:400;
  letter-spacing:.3em; color:var(--faint); margin-top:.45rem}
.pitch{color:var(--ink-soft); font-size:.94rem; margin:.9rem 0 0}
.pitch b{font-weight:500; color:var(--ink); border-bottom:1px solid var(--seal); padding-bottom:1px}
.rooms{display:flex; flex-direction:column; gap:.7rem; margin-top:.4rem}
.room{display:flex; gap:.9rem; align-items:center; text-align:left; width:100%;
  background:var(--paper); border:1px solid var(--rule-soft); border-radius:3px;
  padding:.9rem 1rem; box-shadow:var(--shadow); transition:transform .12s ease}
.room:active{transform:scale(.985)}
.face{width:3rem; height:3rem; flex:none; border-radius:50%; display:grid; place-items:center;
  font-family:"Nanum Myeongjo",serif; font-size:1.35rem; color:var(--paper); background:var(--indigo)}
.face.b{background:var(--seal)}
.room-t{flex:1; min-width:0}
.room-t b{display:block; font-weight:500; font-size:1rem}
.room-t span{display:block; font-size:.8rem; color:var(--muted); overflow:hidden;
  text-overflow:ellipsis; white-space:nowrap}
.room-n{font-family:"IBM Plex Mono",monospace; font-size:.66rem; color:var(--faint); letter-spacing:.08em}
.vow{border-top:1px solid var(--rule); padding-top:1.1rem; font-size:.8rem; color:var(--muted)}
.vow b{color:var(--seal); font-weight:500}

/* ── 채팅 헤더 ──────────────────────────── */
.bar{display:flex; align-items:center; gap:.7rem; padding:.7rem .9rem;
  background:var(--paper); border-bottom:1px solid var(--rule); flex:none}
.bar .face{width:2.1rem; height:2.1rem; font-size:.95rem}
.bar-t{flex:1; min-width:0}
.bar-t b{display:block; font-weight:500; font-size:.92rem; line-height:1.3}
.bar-t span{display:block; font-size:.7rem; color:var(--muted)}
.icon{width:2.1rem; height:2.1rem; border-radius:50%; display:grid; place-items:center;
  font-family:"IBM Plex Mono",monospace; font-size:.85rem; color:var(--muted)}
.icon[aria-pressed="true"]{background:var(--celadon-wash); color:var(--celadon)}

/* ── 메시지 ─────────────────────────────── */
#log{flex:1; min-height:0; overflow-y:auto; padding:1.1rem .9rem 1.4rem;
  display:flex; flex-direction:column; gap:.85rem; scroll-behavior:smooth}
.row{display:flex; gap:.55rem; align-items:flex-end; animation:rise .28s ease both}
@keyframes rise{from{opacity:0; transform:translateY(6px)} to{opacity:1; transform:none}}
.row.me{justify-content:flex-end}
.row .face{width:1.7rem; height:1.7rem; font-size:.75rem; margin-bottom:.1rem}
.bub{max-width:81%; padding:.6rem .85rem; border-radius:3px 12px 12px 12px;
  background:var(--paper); border:1px solid var(--rule-soft); box-shadow:var(--shadow);
  font-size:.95rem; color:var(--ink-soft)}
.row.me .bub{background:var(--indigo); color:var(--on-indigo); border-color:transparent;
  border-radius:12px 3px 12px 12px; font-weight:400}
.bub.appeal{border-left:3px solid var(--seal-rail); background:var(--seal-wash);
  font-family:"Nanum Myeongjo",serif; font-size:1rem; color:var(--ink)}
.bub.appeal::before{content:"정의감 호출"; display:block; font-family:"IBM Plex Mono",monospace;
  font-size:.6rem; letter-spacing:.18em; color:var(--seal); margin-bottom:.25rem}

/* 원문은 말풍선이 아니다 */
.quote{border-left:3px solid var(--seal-rail); background:var(--seal-wash);
  padding:.85rem .95rem 1rem; border-radius:0 3px 3px 0; animation:rise .3s ease both}
.qh{display:flex; flex-wrap:wrap; gap:.45rem; font-family:"IBM Plex Mono",monospace;
  font-size:.62rem; letter-spacing:.12em; color:var(--seal); margin-bottom:.45rem}
.qh em{font-style:normal; color:var(--faint); letter-spacing:.04em}
.qko{font-family:"Nanum Myeongjo",serif; font-size:1.14rem; line-height:1.75; margin:0; white-space:pre-line}
.qko.long{font-size:1.02rem; line-height:1.8}
.qsrc{font-family:"IBM Plex Mono",monospace; font-size:.72rem; line-height:1.7;
  color:var(--muted); margin:.6rem 0 0; white-space:pre-line; display:none}
.quote.open .qsrc{display:block}
.qtoggle{font-family:"IBM Plex Mono",monospace; font-size:.63rem; letter-spacing:.1em;
  color:var(--faint); margin-top:.5rem; padding:.15rem 0}

/* 시스템 알림 */
.sys{align-self:center; max-width:92%; text-align:center; font-size:.76rem; color:var(--ochre);
  background:var(--ochre-wash); border:1px solid var(--ochre-wash); border-radius:99px;
  padding:.4rem .9rem; animation:rise .3s ease both}
.sys b{font-weight:500}

/* 계기 */
.gauge{display:none; flex-wrap:wrap; gap:.1rem .8rem; margin:-.35rem 0 0 2.25rem;
  font-family:"IBM Plex Mono",monospace; font-size:.64rem; font-variant-numeric:tabular-nums;
  color:var(--faint)}
body.gauges .gauge{display:flex}
.gauge b{font-weight:500; color:var(--muted)}
.gauge .why{width:100%; font-family:"IBM Plex Sans KR",sans-serif; font-size:.68rem; color:var(--faint)}

/* 대조 카드 */
.contrast{background:var(--paper); border:1px solid var(--rule-soft); border-radius:3px;
  padding:.9rem 1rem; box-shadow:var(--shadow); animation:rise .3s ease both}
.contrast h4{font-family:"IBM Plex Mono",monospace; font-size:.63rem; letter-spacing:.16em;
  color:var(--celadon); margin:0 0 .6rem; font-weight:500}
.side{padding-left:.7rem; border-left:2px solid var(--rule); margin-bottom:.7rem}
.side .lbl{font-family:"IBM Plex Mono",monospace; font-size:.6rem; letter-spacing:.14em;
  color:var(--faint); display:block; margin-bottom:.15rem}
.side.orig{border-color:var(--seal-rail)}
.side.orig p{font-family:"Nanum Myeongjo",serif; font-size:1rem; margin:0; white-space:pre-line}
.side.para p{font-size:.9rem; color:var(--ink-soft); margin:0}
.ask{font-size:.85rem; color:var(--ink); margin:.2rem 0 .55rem}
.choose{display:flex; gap:.5rem}
.choose button{flex:1; border:1px solid var(--rule); border-radius:2px; padding:.45rem;
  font-size:.82rem; color:var(--ink-soft)}
.choose button:active{background:var(--sunken)}
.verdict-txt{font-size:.85rem; color:var(--ink-soft); margin:.55rem 0 0}

/* 하단 */
.chips{display:flex; gap:.4rem; overflow-x:auto; padding:.5rem .9rem 0; flex:none;
  scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none; border:1px solid var(--rule); border-radius:99px; padding:.28rem .75rem;
  font-size:.78rem; color:var(--muted); background:var(--paper)}
.chip:active{background:var(--sunken)}
.composer{display:flex; gap:.5rem; align-items:center; padding:.6rem .9rem calc(.7rem + env(safe-area-inset-bottom));
  background:var(--paper); border-top:1px solid var(--rule); flex:none}
.composer input{flex:1; min-width:0; background:var(--ground); border:1px solid var(--rule);
  border-radius:99px; padding:.6rem .95rem; font-size:.95rem; color:var(--ink)}
.composer input::placeholder{color:var(--faint)}
.send{width:2.4rem; height:2.4rem; flex:none; border-radius:50%; background:var(--indigo);
  color:var(--on-indigo); display:grid; place-items:center; font-size:1rem}
.send:disabled{opacity:.35}
.typing{display:flex; gap:.22rem; padding:.7rem .9rem}
.typing i{width:.32rem; height:.32rem; border-radius:50%; background:var(--faint);
  animation:blink 1.1s infinite}
.typing i:nth-child(2){animation-delay:.18s} .typing i:nth-child(3){animation-delay:.36s}
@keyframes blink{0%,60%,100%{opacity:.25} 30%{opacity:1}}
</style>

<div id="app">

<section id="home" class="view on">
  <div>
    <h1 class="brand">筆談<small>PILDAM</small></h1>
    <p class="pitch">400년 전 사람과 대화하는 방법은 예나 지금이나 <b>쓰인 것</b>뿐입니다.
      문우를 골라 말을 거십시오. 붉은 칸의 문장은 전부 죽은 사람이 썼습니다.</p>
  </div>
  <nav class="rooms" id="rooms"></nav>
  <p class="vow"><b>이 앱의 규칙 하나.</b> AI는 문학을 쓰지 않습니다.
    인용문은 모델이 만들 수 없고 코퍼스에서만 나옵니다. 요약을 요구해도 요약하지 않습니다.</p>
</section>

<section id="chat" class="view">
  <header class="bar">
    <button class="icon" id="back" aria-label="문우 목록으로">←</button>
    <div class="face" id="face">셰</div>
    <div class="bar-t"><b id="who">—</b><span id="what">—</span></div>
    <button class="icon" id="gtoggle" aria-pressed="false" aria-label="계기 보기">δπ</button>
  </header>
  <div id="log"></div>
  <div class="chips" id="chips"></div>
  <form class="composer" id="form">
    <input id="say" placeholder="문우에게 말을 거십시오" autocomplete="off" enterkeyhint="send">
    <button class="send" id="sendbtn" type="submit" aria-label="보내기">↑</button>
  </form>
</section>

</div>


<script>
const api = (p, b) => fetch(p, {method:"POST", headers:{"Content-Type":"application/json"},
  body: JSON.stringify(b)}).then(async r => { if(!r.ok) throw new Error((await r.json()).detail || r.status); return r.json(); });

let S = null, busy = false;
const log = document.getElementById("log");
const scroll = () => { log.scrollTop = log.scrollHeight; };
const el = h => { const t = document.createElement("template"); t.innerHTML = h.trim(); return t.content.firstElementChild; };
const esc = s => (s||"").replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const sleep = ms => new Promise(r => setTimeout(r, ms));
const show = id => document.querySelectorAll(".view").forEach(v => v.classList.toggle("on", v.id === id));

function mine(t){ log.append(el(`<div class="row me"><div class="bub">${esc(t)}</div></div>`)); scroll(); }
function bubble(t, cls){ log.append(el(`<div class="row"><div class="face ${S.cls}">${S.face}</div>
  <div class="bub ${cls||""}">${esc(t)}</div></div>`)); scroll(); }
function sysLine(h){ log.append(el(`<div class="sys">${h}</div>`)); scroll(); }
function quoteCard(b){
  const card = el(`<div class="quote">
    <div class="qh"><span>원문</span><em>${esc(b.work_title)} · ${esc(b.locus)}</em></div>
    <p class="qko${b.text_ko.length>150?" long":""}">${esc(b.text_ko)}</p>
    <div class="qsrc">${esc(b.text_src)}</div>
    <button class="qtoggle">원어 보기 ↓</button></div>`);
  const btn = card.querySelector(".qtoggle");
  btn.addEventListener("click", () => { card.classList.toggle("open");
    btn.textContent = card.classList.contains("open") ? "원어 접기 ↑" : "원어 보기 ↓"; });
  log.append(card); scroll();
}
function gaugeLine(g){
  const q = g.served_passage ? `<span>VQR <b>${g.vqr?.toFixed(2) ?? "—"}</b></span>` : `<span>응대 · 인용 없음</span>`;
  log.append(el(`<div class="gauge"><span>δ <b>${g.delta.toFixed(2)}</b></span><span>π <b>${g.pi.toFixed(2)}</b></span>
    <span>τ <b>${g.tau}</b></span>${q}<span>SLP <b>${(g.slp??0).toFixed(2)}</b></span>
    <span class="why">${esc(g.note)} → ${esc(g.why)}</span></div>`)); scroll();
}
let dots = null;
function typingOn(){ dots = el(`<div class="row"><div class="face ${S.cls}">${S.face}</div>
  <div class="bub typing"><i></i><i></i><i></i></div></div>`); log.append(dots); scroll(); }
function typingOff(){ dots?.remove(); dots = null; }

async function send(text){
  if (busy || !S) return;
  busy = true; document.getElementById("sendbtn").disabled = true;
  mine(text); typingOn();
  try {
    const r = await api("/api/turn", {session_id: S.id, text});
    typingOff();
    if (r.notice) sysLine(`이 대화의 응답은 <b>AI가 생성</b>합니다. 붉은 칸의 인용문만 원문입니다.`);
    for (const b of r.blocks){
      if (b.type === "quote") quoteCard(b);
      else bubble(b.text, b.type === "appeal" ? "appeal" : "");
      await sleep(90);
    }
    if (r.fallback) sysLine(`프레임이 계약을 통과하지 못했습니다 (${r.fallback.join(", ")}). 원문만 제시합니다.`);
    gaugeLine(r.gauge);
    S.tau = r.gauge.tau;
    document.getElementById("what").textContent = S.title + " · τ " + S.tau;
  } catch(e){
    typingOff(); sysLine(`생성에 실패했습니다. ${esc(String(e.message||e))}`);
  } finally {
    busy = false; document.getElementById("sendbtn").disabled = false;
    document.getElementById("say").focus();
  }
}

async function openRoom(room){
  const r = await api("/api/open", {room: room.id, tau: 2});
  S = {id: r.session_id, title: r.title, tau: r.tau,
       face: r.writer.slice(0,1), cls: room.writer === "austen" ? "b" : ""};
  document.getElementById("face").textContent = S.face;
  document.getElementById("face").className = "face " + S.cls;
  document.getElementById("who").textContent = r.writer;
  document.getElementById("what").textContent = r.title + " · τ " + r.tau;
  log.innerHTML = ""; show("chat");
  sysLine(`${esc(r.writer)} · 몰년 ${r.died}. 원문은 Project Gutenberg 저본에서 추출됐습니다.`);
  send("안녕하세요");
}

const CHIPS = [
  {t:"계속", say:"계속"},
  {t:"요약해줘", say:"그냥 줄거리 요약해줘"},
  {t:"밑줄", say:"이 구절 밑줄 긋고 싶어"},
  {t:"τ +20", act:"tau"},
];
fetch("/api/rooms").then(r => r.json()).then(({rooms}) => {
  document.getElementById("rooms").append(...rooms.map(room => {
    const b = el(`<button class="room"><div class="face ${room.writer==="austen"?"b":""}">${room.writer_name.slice(0,1)}</div>
      <div class="room-t"><b>${room.title}</b><span>${room.writer_name} — ${room.hook}</span></div>
      <span class="room-n">몰년 ${room.died}</span></button>`);
    b.addEventListener("click", () => openRoom(room));
    return b;
  }));
});
document.getElementById("chips").append(...CHIPS.map(c => {
  const b = el(`<button class="chip">${c.t}</button>`);
  b.addEventListener("click", async () => {
    if (busy || !S) return;
    if (c.act === "tau"){
      const r = await api("/api/tau", {session_id: S.id, text: "20"});
      S.tau = r.tau; document.getElementById("what").textContent = S.title + " · τ " + S.tau;
      return sysLine(`τ를 <b>${r.tau}</b>로 올렸습니다. 이제 정의감 호출이 가능합니다.`);
    }
    send(c.say);
  });
  return b;
}));
document.getElementById("back").addEventListener("click", () => show("home"));
document.getElementById("gtoggle").addEventListener("click", e => {
  const on = document.body.classList.toggle("gauges");
  e.currentTarget.setAttribute("aria-pressed", on);
});
document.getElementById("form").addEventListener("submit", e => {
  e.preventDefault();
  const i = document.getElementById("say"), v = i.value.trim();
  if (!v) return; i.value = ""; send(v);
});
</script>
